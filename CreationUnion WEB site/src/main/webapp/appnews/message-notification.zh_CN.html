<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CreationUnion VIP 策略重大更新：取消安装限制，支持一次购买、任意安装。">
  <title>VIP 策略重大更新 - CreationUnion</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body.appnews-page {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, #f7faff 0%, #edf3ff 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .appnews-page .hero-card {
      width: min(760px, 100%);
      background: #ffffff;
      border: 1px solid #dbe6ff;
      border-radius: 20px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      padding: clamp(1.4rem, 4vw, 2.3rem);
    }
    .appnews-page .eyebrow {
      display: inline-block;
      margin: 0 0 0.8rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.86rem;
      font-weight: 700;
      color: #0b57d0;
      background: #eaf1ff;
      border-radius: 999px;
    }
    .appnews-page h1 {
      margin: 0 0 0.9rem;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.2;
    }
    .appnews-page p {
      margin: 0;
      line-height: 1.75;
      color: #334155;
      font-size: 1.03rem;
    }
  </style>
</head>
<body class="appnews-page">
  <main class="hero-card" aria-label="VIP 策略更新通知">
    <p class="eyebrow">重大更新 · VIP 策略</p>
    <h1>VIP 策略重大更新</h1>
    <p>我们已取消安装数量限制：从现在起，VIP 用户一次购买即可在任意设备上安装和激活，无需额外付费或逐一登记设备。</p>
  </main>
</body>
</html>
