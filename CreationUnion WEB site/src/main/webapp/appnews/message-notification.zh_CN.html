<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CreationUnion VIP 策略重大更新：取消安装限制，支持一次购买、任意安装。">
  <title>VIP 策略重大更新 - CreationUnion</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body.appnews-page {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, #f7faff 0%, #edf3ff 100%);
      color: #0f172a;
    }
    .appnews-page .site-top {
      margin-bottom: 1rem;
    }
    .appnews-page .site-banner {
      height: clamp(78px, 9vw, 132px);
    }
    .appnews-page .site-nav-shell {
      background: rgba(255, 255, 255, 0.96);
    }
    .appnews-page .site-top .brand-link {
      font-size: 1.05rem;
    }
    .appnews-page .site-top .main-nav a {
      padding: 0.5rem 0.85rem;
    }
    .appnews-page .page-wrap {
      padding: 0 1.25rem 1.25rem;
      display: flex;
      justify-content: center;
    }
    .appnews-page .hero-card {
      width: min(760px, 100%);
      background: #ffffff;
      border: 1px solid #dbe6ff;
      border-radius: 20px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      padding: clamp(1.4rem, 4vw, 2.3rem);
    }
    .appnews-page .eyebrow {
      display: inline-block;
      margin: 0 0 0.8rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.86rem;
      font-weight: 700;
      color: #0b57d0;
      background: #eaf1ff;
      border-radius: 999px;
    }
    .appnews-page p {
      margin: 0;
      line-height: 1.75;
      color: #334155;
      font-size: 1.03rem;
    }
  </style>
  <script src="../js/include.js" defer></script>
</head>
<body class="appnews-page">
  <header class="site-header site-top">
    <div class="site-banner" aria-hidden="true"></div>
    <div class="site-nav-shell">
      <div class="container site-nav-inner">
        <a class="brand brand-link" href="../index.html">robinsoft</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primaryNav" data-nav-toggle>
          <span class="nav-toggle__icon" aria-hidden="true"><span></span></span>
          <span>菜单</span>
        </button>
        <div class="site-nav-panel" id="primaryNav" data-nav-panel>
          <nav class="main-nav" aria-label="主导航">
            <a href="../index.html" data-nav-path="index.html">首页</a>
            <a href="../products.html" data-nav-path="products.html">产品</a>
            <a href="../about.html" data-nav-path="about.html">关于我们</a>
          </nav>
        </div>
        <label class="lang-switcher" for="langSelect">
          <span class="sr-only">语言选择</span>
          <select id="langSelect" class="lang-select" aria-label="语言选择">
            <option value="en">English</option>
            <option value="zh_CN" selected>简体中文</option>
            <option value="zh_TW">繁体中文</option>
            <option value="fr">Français</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <div class="page-wrap">
    <main class="hero-card" aria-label="VIP 策略更新通知">
      <p class="eyebrow">重大更新 · VIP 策略</p>
      <p>我们已取消安装数量限制：从现在起，VIP 用户一次购买即可在任意设备上安装和激活，无需额外付费或逐一登记设备。</p>
    </main>
  </div>
</body>
</html>
