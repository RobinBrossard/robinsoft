<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Major CreationUnion VIP policy update: one purchase and install on any device.">
  <title>Major VIP Policy Update - CreationUnion</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body.appnews-page {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, #f7faff 0%, #edf3ff 100%);
      color: #0f172a;
    }
    .appnews-page .site-top {
      margin-bottom: 1rem;
    }
    .appnews-page .site-banner {
      height: clamp(78px, 9vw, 132px);
    }
    .appnews-page .site-nav-shell {
      background: rgba(255, 255, 255, 0.96);
    }
    .appnews-page .site-top .brand-link {
      font-size: 1.05rem;
    }
    .appnews-page .site-top .main-nav a {
      padding: 0.5rem 0.85rem;
    }
    .appnews-page .page-wrap {
      padding: 0 1.25rem 1.25rem;
      display: flex;
      justify-content: center;
    }
    .appnews-page .hero-card {
      width: min(760px, 100%);
      background: #ffffff;
      border: 1px solid #dbe6ff;
      border-radius: 20px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      padding: clamp(1.4rem, 4vw, 2.3rem);
    }
    .appnews-page .eyebrow {
      display: inline-block;
      margin: 0 0 0.8rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.86rem;
      font-weight: 700;
      color: #0b57d0;
      background: #eaf1ff;
      border-radius: 999px;
    }
    .appnews-page h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.5rem, 3.2vw, 2.15rem);
      line-height: 1.2;
      color: #0f172a;
    }
    .appnews-page p {
      margin: 0;
      line-height: 1.75;
      color: #334155;
      font-size: 1.03rem;
    }
  </style>
  <script>
    window.i18n = window.i18n || {};
    window.i18n.pageTitleKey = 'vip.pageTitle';
  </script>
  <script src="../js/include.js" defer></script>
  <script src="../js/i18n.js" defer></script>
</head>
<body class="appnews-page">
  <header class="site-header site-top">
    <div class="site-banner" aria-hidden="true"></div>
    <div class="site-nav-shell">
      <div class="container site-nav-inner">
        <a class="brand brand-link" href="../index.html" data-i18n="brand">robinsoft</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primaryNav" data-nav-toggle>
          <span class="nav-toggle__icon" aria-hidden="true"><span></span></span>
          <span data-i18n="nav.menu">Menu</span>
        </button>
        <div class="site-nav-panel" id="primaryNav" data-nav-panel>
          <nav class="main-nav" aria-label="Main navigation">
            <a href="../index.html" data-nav-path="index.html" data-i18n="nav.home">Home</a>
            <a href="../products.html" data-nav-path="products.html" data-i18n="nav.products">Products</a>
            <a href="../about.html" data-nav-path="about.html" data-i18n="nav.about">About</a>
          </nav>
        </div>
        <label class="lang-switcher" for="langSelect">
          <span class="sr-only">Language</span>
          <select id="langSelect" class="lang-select" aria-label="Language" onchange="(window.i18n && window.i18n.setLang) ? window.i18n.setLang(this.value) : null">
            <option value="en">English</option>
            <option value="zh_CN">简体中文</option>
            <option value="zh_TW">繁體中文</option>
            <option value="fr">Français</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <div class="page-wrap">
    <main class="hero-card" aria-label="VIP policy update notification">
      <p class="eyebrow" data-i18n="vip.eyebrow">MAJOR UPDATE · VIP POLICY</p>
      <h1 data-i18n="vip.title">Major VIP Policy Update</h1>
      <p data-i18n="vip.hero_copy">Installation limits are gone. From now on, one VIP purchase lets you install and activate on any device, with no extra fees and no per-device registration.</p>
    </main>
  </div>
</body>
</html>
